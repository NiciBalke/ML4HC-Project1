# Best contrastive config from logs/ + local wandb summaries
# run_id: uxd948n8
# metric: summary/test_auroc = 0.8135916528773671
# summary/test_auprc = 0.3736261580668803

ssl_method: contrastive
batch_size: 16
contrastive_weight: 1.5
d_model: 64
drop_ratio: 0.05
hard_negative_k: 3
layers: 3
lr: 0.0005
mask_ratio: 0.1
max_seq_len: 512
monitor_every: 1
multiscale_ratios: [1.0]
nhead: 2
pretrain_epochs: 30
reconstruction_weight: 1.5
seed: 42
temperature: 0.05
time_freq_weight: 0.0
value_bins: 10

early_stop_patience: 5
early_stop_min_delta: 0.0001
restore_best_weights: true
